name: Validate Kali-AD-Lab

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Bash syntax
        run: |
          bash -n kali-ad-lab
          bash -n bootstrap.sh
          bash -n scripts/destroy-lab.sh

      - name: Validate unattended XML template
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('templates/Autounattend.xml.template')
          print('Autounattend XML is well formed')
          PY

      - name: Validate deferred AD bootstrap architecture
        run: |
          test -f windows/Configure-AD.ps1
          test -f windows/SetupComplete.cmd
          grep -q 'Install-ADDSForest' windows/Configure-AD.ps1
          grep -q 'Wait-WindowsSetupComplete' windows/Configure-AD.ps1
          grep -q 'Microsoft-Windows-Deployment' templates/Autounattend.xml.template
          grep -q '<RunSynchronous>' templates/Autounattend.xml.template
          grep -q 'Kali-AD-Lab-ConfigureAD' templates/Autounattend.xml.template
          grep -q 'New-ScheduledTaskTrigger -AtStartup' templates/Autounattend.xml.template
          ! grep -q 'Start-ScheduledTask' templates/Autounattend.xml.template
          ! grep -q '<AutoLogon>' templates/Autounattend.xml.template
          ! grep -q 'FirstLogonCommands' templates/Autounattend.xml.template
          ! test -e setup.sh
          ! test -e windows/Stage1.ps1
          ! test -e windows/Stage2.ps1
          ! test -e windows/Stage3.ps1
          ! grep -R -E 'Stage1\.ps1|Stage2\.ps1|Stage3\.ps1' -n kali-ad-lab windows templates
          ! grep -R 'LABTOOLS' -n windows templates
